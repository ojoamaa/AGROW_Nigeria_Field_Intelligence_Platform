services:
  - type: web
    name: agrow-field
    runtime: python
    buildCommand: pip install -r requirements_field.txt
    startCommand: python -m uvicorn field_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/field/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FIELD_API_SECRET
        generateValue: true
      - key: QR_SECRET_KEY
        sync: false
